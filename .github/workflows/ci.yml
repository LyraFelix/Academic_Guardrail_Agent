name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Build and install the package with current dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip wheel --no-deps --wheel-dir scratch/dist .
        python -m pip install --upgrade -r requirements-dev.txt scratch/dist/*.whl
        python -m pip check
        python -m pip freeze > scratch/installed.txt
        python -c "import academic_guardrail; from importlib.metadata import version; print('package:', academic_guardrail.__file__); print('mcp:', version('mcp'))"

    - name: Run unit and real stdio transport tests
      run: python -m pytest tests -q --junitxml=scratch/pytest.xml

    - name: Validate offline workflows through the installed server
      run: |
        academic-guardrail --help
        python scripts/validate_phase_two.py --output-dir scratch/phase_two
        python scripts/validate_phase_three.py --output-dir scratch/phase_three
        python scripts/validate_client_review.py --output-dir scratch/client_review
        python -m scripts.validate_local_followup --output scratch/local_followup
        python -m scripts.validate_manuscript_review --output scratch/manuscript_demo

    - name: Save environment, test results and workflow evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-${{ matrix.os }}-py${{ matrix.python-version }}
        path: scratch/
        retention-days: 14
