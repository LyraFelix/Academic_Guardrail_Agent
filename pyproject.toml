[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-academic-guardrail"
version = "0.1.0"
description = "A unified academic research integrity, citation, and claim verifier MCP server & CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Academic Guardrail Contributors" }
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "click>=8.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
full = [
    "sentence-transformers>=2.2.0"
]

[project.scripts]
academic-guardrail = "academic_guardrail.cli:main"
academic-guardrail-mcp = "academic_guardrail.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_guardrail"]
